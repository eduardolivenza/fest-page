name: CI/CD — api

# Triggers only when the api (Java / Spring Boot, Gradle) changes.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/festpage/api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      # Java major: "java" in apps/api/gradle/libs.versions.toml (scripts/check-versions.mjs)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Compiles every module and runs all tests (unit, web, and the embedded-PostgreSQL ones).
      - run: ./gradlew build

  version:
    name: Create version tag
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: mathieudutour/github-tag-action@v7.0.0
        id: tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: api-v

  build:
    name: Build api image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  update-gitops:
    name: Update image tag
    needs: [version, build]
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-values-push
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The latest main, not the commit that triggered this run: other runs may have bumped tags since.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Bump image tag and push
        env:
          TAG: ${{ needs.version.outputs.tag }}
          FILE: helm/api/values.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Every attempt starts from the latest main and re-applies the edit, so a bump pushed by another run
          # in the meantime (same line of the same file) can never cause a conflict.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            current=$(yq '.image.tag' "$FILE")
            # Builds can finish out of order: never replace a newer tag with an older one.
            if [ "$current" = "$TAG" ] || [ "$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
              echo "$FILE already at $current (this run built $TAG): nothing to do"
              exit 0
            fi
            yq -i ".image.tag = \"$TAG\"" "$FILE"
            git commit -qam "ci: update api image to $TAG [skip ci]"
            if git push -q origin HEAD:main; then
              echo "$FILE: $current -> $TAG"
              exit 0
            fi
            echo "Push rejected (main moved), retrying ($attempt/5)..."
            sleep "$attempt"
          done
          echo "Failed to push after 5 attempts"
          exit 1
