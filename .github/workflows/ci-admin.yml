name: CI/CD — admin

# Triggers only when admin app or its shared dependencies change.
#
# Optional repository variable:
#   NEXT_PUBLIC_API_URL — defaults to https://api.festdescans.com

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - 'packages/types/**'
      - 'packages/config/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/festpage/admin
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @festpage/admin test

  version:
    name: Create version tag
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: mathieudutour/github-tag-action@v7.0.0
        id: tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: admin-v

  build:
    name: Build admin image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.festdescans.com' }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  update-gitops:
    name: Update image tag
    needs: [version, build]
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-values-push
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The latest main, not the commit that triggered this run: other runs may have bumped tags since.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Bump image tag and push
        env:
          TAG: ${{ needs.version.outputs.tag }}
          FILE: helm/admin/values.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Every attempt starts from the latest main and re-applies the edit, so a bump pushed by another run
          # in the meantime (same line of the same file) can never cause a conflict.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            current=$(yq '.image.tag' "$FILE")
            # Builds can finish out of order: never replace a newer tag with an older one.
            if [ "$current" = "$TAG" ] || [ "$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
              echo "$FILE already at $current (this run built $TAG): nothing to do"
              exit 0
            fi
            yq -i ".image.tag = \"$TAG\"" "$FILE"
            git commit -qam "ci: update admin image to $TAG [skip ci]"
            if git push -q origin HEAD:main; then
              echo "$FILE: $current -> $TAG"
              exit 0
            fi
            echo "Push rejected (main moved), retrying ($attempt/5)..."
            sleep "$attempt"
          done
          echo "Failed to push after 5 attempts"
          exit 1
