name: CI/CD

# Flow:
#   1. lint         — type-check every push / PR
#   2. version      — bump semver tag on main (conventional commits)
#   3. build        — build & push 3 Docker images to ghcr.io (parallel)
#   4. update-gitops — write the new tag into each chart's values.yaml
#                      and commit back → ArgoCD picks up the change per-chart
#
# Required repository secrets:  none beyond the default GITHUB_TOKEN
# Optional repository variable:
#   NEXT_PUBLIC_API_URL — defaults to http://api.festdescans.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/festpage
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Type check (PRs + main) ────────────────────────────────────────────────
  lint:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ─── Auto-tag (main only) ───────────────────────────────────────────────────
  version:
    name: Create version tag
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}         # e.g. v1.2.3
      version: ${{ steps.tag.outputs.new_version }} # e.g. 1.2.3
    steps:
      - uses: mathieudutour/github-tag-action@v6.2
        id: tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  # ─── Build & push images (parallel) ─────────────────────────────────────────
  build:
    name: Build ${{ matrix.app }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, admin, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.app }}:${{ needs.version.outputs.tag }}
            ${{ env.IMAGE_BASE }}/${{ matrix.app }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://api.festdescans.com' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ─── Update each chart's values.yaml → ArgoCD deploys per-chart ─────────────
  #
  # Each chart (helm/web, helm/admin, helm/api) has its own values.yaml with
  # its own image.tag. Updating them independently means ArgoCD can sync each
  # Application on its own, and you can roll back a single chart without
  # touching the others.
  #
  # The commit uses [skip ci] so it doesn't trigger another pipeline run.
  # ArgoCD still picks it up via webhook or polling.
  update-gitops:
    name: Update image tags
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump image tag in each chart
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          yq -i ".image.tag = \"${TAG}\"" helm/web/values.yaml
          yq -i ".image.tag = \"${TAG}\"" helm/admin/values.yaml
          yq -i ".image.tag = \"${TAG}\"" helm/api/values.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/web/values.yaml helm/admin/values.yaml helm/api/values.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update images to ${{ needs.version.outputs.tag }} [skip ci]"
          git push
