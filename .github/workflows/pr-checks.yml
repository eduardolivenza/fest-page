name: PR checks

# Gate for merging into main: install, typecheck, test and build every app, and build the Docker images.
# Runs on every PR (no path filter) so the required "Checks" status always reports;
# a path-filtered required check would stay pending forever on PRs it skips.
#
# Make it required: Settings → Rules → Rulesets → main → "Require status checks to pass" →
# "Checks", "Image (api)", "Image (web)", "Image (admin)".

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Every Node/pnpm/Prisma/Next pin must agree (scripts/check-versions.mjs).
      - name: Version pins
        run: node scripts/check-versions.mjs

      # Fails on a stale or badly merged lockfile (e.g. two Renovate PRs merged back to back).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Build
        run: pnpm --filter "./apps/*" run build

      # api (Java): compile all modules and run every test, including the real-PostgreSQL ones
      # (embedded server, no Docker needed). Java major: apps/api/gradle/libs.versions.toml.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Api build and tests
        working-directory: apps/api
        run: ./gradlew build

      # Charts are only applied by ArgoCD after merge: at least make sure they render.
      - name: Helm charts
        run: |
          for c in helm/*/; do
            helm lint "$c"
            helm template ci "$c" > /dev/null
          done

  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only (no push): catches Dockerfile and native-module breakage before merge.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: festpage-${{ matrix.app }}:pr
          cache-from: type=gha,scope=${{ matrix.app }}
      # Runs the api image the way the cluster does: the migrate initContainer command, then the
      # server against a real PostgreSQL; then logs in with an Argon2 hash and a JWT through the image.
      - name: Smoke test api image
        if: matrix.app == 'api'
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/festpage
          SPRING_DATASOURCE_USERNAME: festpage
          SPRING_DATASOURCE_PASSWORD: festpage
        run: |
          retry() { n=$1; shift; for i in $(seq "$n"); do "$@" && return 0; sleep 2; done; return 1; }

          # Same PostgreSQL image, init script and settings as production (helm/api):
          # superuser "postgres", app user created by the init script, owner but not superuser.
          pg_image=$(yq '.postgresql.image.repository + ":" + .postgresql.image.tag + "@" + .postgresql.image.digest' helm/api/values.yaml)
          pg_args=$(yq '.postgresql.config | to_entries | map("-c " + .key + "=" + (.value | tostring)) | join(" ")' helm/api/values.yaml)
          mkdir -p "$RUNNER_TEMP/initdb"
          helm template ci helm/api --show-only templates/postgresql.yaml \
            | yq 'select(.kind == "ConfigMap") | .data["10-app-user.sh"]' > "$RUNNER_TEMP/initdb/10-app-user.sh"
          chmod -R a+rX "$RUNNER_TEMP/initdb"
          docker run -d --name pg -p 5432:5432 --user 999:999 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci-superuser -e POSTGRES_DB=festpage \
            -e APP_DB_USER=festpage -e APP_DB_PASSWORD=festpage \
            -v "$RUNNER_TEMP/initdb:/docker-entrypoint-initdb.d:ro" \
            "$pg_image" postgres $pg_args

          # TCP only answers once init (and the init script) is done; then the app user
          # must exist and must not be a superuser.
          retry 15 docker exec pg pg_isready -h 127.0.0.1 -U festpage -d festpage
          test "$(docker exec pg psql -U postgres -d festpage -tAc \
            "select rolsuper from pg_roles where rolname = 'festpage'")" = f

          # Exactly what the migrate initContainer runs (helm/api/templates/deployment.yaml); twice: idempotent.
          migrate() { docker run --rm --network host -e SPRING_DATASOURCE_URL -e SPRING_DATASOURCE_USERNAME \
            -e SPRING_DATASOURCE_PASSWORD festpage-api:pr \
            java -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -cp app.jar com.festdescans.api.MigrateDatabase; }
          retry 15 migrate
          second=$(migrate) && grep -q 'No migration necessary' <<<"$second"

          docker run -d --name api --network host -m 512m -e SPRING_DATASOURCE_URL -e SPRING_DATASOURCE_USERNAME \
            -e SPRING_DATASOURCE_PASSWORD -e JWT_SECRET=ci-smoke-test-jwt-secret-0123456789abcdef festpage-api:pr
          retry 60 curl -fsS localhost:3001/health/readiness
          curl -fsS localhost:3001/health | grep -q '"status":"UP"'   # includes the database check
          curl -fsS localhost:3001/api/products | tee /dev/stderr | grep -q '"total":0'

          # Dev seed: an admin with an Argon2 hash, and 6 products.
          docker exec -i pg psql -v ON_ERROR_STOP=1 -U festpage -d festpage < apps/api/dev/seed.sql
          curl -fsS localhost:3001/api/products | grep -q '"total":6'
          token=$(curl -fsS -X POST localhost:3001/api/admin/auth/login -H 'content-type: application/json' \
            -d '{"email":"admin@festpage.com","password":"admin123!"}' | jq -r .token)
          curl -fsS localhost:3001/api/admin/auth/me -H "authorization: Bearer $token" | grep -q admin@festpage.com
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/admin/orders)" = 401
          docker stats --no-stream --format 'api memory: {{.MemUsage}}' api
          echo "api image ok"

      - name: Api container logs
        if: failure() && matrix.app == 'api'
        run: |
          docker logs pg || true
          docker logs api || true
