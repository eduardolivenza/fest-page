packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 fails the install when a dependency has an install script that is not listed here.
allowBuilds:
  argon2: true           # native password hashing (api)
  prisma: true
  '@prisma/engines': true  # migration engine used by `prisma migrate deploy`
  esbuild: true          # tsx, vitest
  nx: true
  cpu-features: false    # optional native speed-ups pulled in by testcontainers
  ssh2: false
  protobufjs: false
  '@parcel/watcher': false

# Don't let `pnpm run` start an install when node_modules looks stale (Docker build stages
# copy node_modules between stages; CI installs explicitly with --frozen-lockfile).
verifyDepsBeforeRun: false
