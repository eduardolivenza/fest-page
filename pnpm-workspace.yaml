packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 fails the install when a dependency has an install script that is not listed here.
allowBuilds:
  esbuild: true          # vitest
  '@parcel/watcher': false  # optional native build, pulled in by sass (via next/vite peers)

# Don't let `pnpm run` start an install when node_modules looks stale (Docker build stages
# copy node_modules between stages; CI installs explicitly with --frozen-lockfile).
verifyDepsBeforeRun: false
