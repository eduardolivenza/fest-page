image:
  repository: ghcr.io/eduardolivenza/festpage/web
  tag: web-v0.0.7
  pullPolicy: IfNotPresent
replicas: 1
service:
  port: 3000
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
# The API URL is baked into the image at build time (NEXT_PUBLIC_API_URL build arg in CI).
global:
  # Pull secret for the private ghcr.io images. The SealedSecret lives in the api chart
  # (helm/api/templates/sealed-ghcr-credentials.yaml); all apps share the namespace.
  imagePullSecrets:
    - name: ghcr-credentials
