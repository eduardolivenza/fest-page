# ── Global ─────────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""
  imagePullSecrets: []

createNamespace: false

# ── Secrets ─────────────────────────────────────────────────────────────────────
# secrets.create=true  → Helm creates the K8s Secret (use for manual helm install)
# secrets.create=false → Secret must exist already (use when deploying via ArgoCD)
#
# When true, pass real values at install time — never commit them here:
#   --set secrets.jwtSecret=<value> --set postgresql.auth.password=<value>
secrets:
  create: true
  jwtSecret: ""

# ── Web (Next.js storefront) ────────────────────────────────────────────────────
web:
  image:
    repository: festpage/web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# ── Admin (Next.js back-office) ─────────────────────────────────────────────────
admin:
  image:
    repository: festpage/admin
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

# ── API (Fastify) ────────────────────────────────────────────────────────────────
api:
  image:
    repository: festpage/api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# ── Ingress ──────────────────────────────────────────────────────────────────────
ingress:
  className: nginx
  hosts:
    web: festpage.com
    api: api.festpage.com
    admin: admin.festpage.com
  tls:
    enabled: true
    secretName: festpage-tls
    clusterIssuer: letsencrypt-prod

# ── PostgreSQL (bitnami/postgresql subchart) ─────────────────────────────────────
postgresql:
  enabled: true
  auth:
    database: festpage
    username: festpage
    password: ""
  primary:
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
