# When deploying via ArgoCD, set secrets.create=false and create the secret manually:
#
#   kubectl create secret generic festpage-api \
#     --from-literal=JWT_SECRET=<value> \
#     --from-literal=DATABASE_URL="postgresql://festpage:<pass>@festpage-postgresql:5432/festpage" \
#     -n festpage
#
# When deploying via Helm CLI directly, leave secrets.create=true (default) and pass:
#   --set secrets.jwtSecret=<value> --set postgresql.auth.password=<value>

{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "festpage.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s"
    .Values.postgresql.auth.username
    (required "postgresql.auth.password is required when secrets.create=true" .Values.postgresql.auth.password)
    (include "festpage.postgresHost" .)
    .Values.postgresql.auth.database | quote }}
{{- end }}
