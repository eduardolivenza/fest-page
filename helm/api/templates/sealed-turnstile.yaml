# Secret fest-descans-api-turnstile (TURNSTILE_SECRET_KEY). Sealed for the homelab cluster.
# Rotate with kubeseal (see homelab repo, homelab-secrets skill). Never commit plaintext.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: fest-descans-api-turnstile
  namespace: fest-descans
spec:
  encryptedData:
    TURNSTILE_SECRET_KEY: 
  template:
    metadata:
      name: fest-descans-api-turnstile
      namespace: fest-descans
    type: Opaque
