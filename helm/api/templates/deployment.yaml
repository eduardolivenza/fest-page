apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  # Old ReplicaSets kept for `kubectl rollout undo` (default 10)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Flyway migrations (apps/api/adapter-out-persistence/src/main/resources/db/migration) through a
          # minimal Spring context (DataSource + Flyway only). Retries until PostgreSQL is ready. The first run
          # on the Prisma-created database only records a baseline (V3) after checking _prisma_migrations.
          command:
            - sh
            - -c
            - |
              until java -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -cp app.jar com.festdescans.api.MigrateDatabase; do
                echo "Migration failed (PostgreSQL not ready yet?), retrying in 5s..."
                sleep 5
              done
          env:
            {{- include "api.datasourceEnv" . | nindent 12 }}
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- include "api.datasourceEnv" . | nindent 12 }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: JWT_SECRET
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-turnstile
                  key: TURNSTILE_SECRET_KEY
                  optional: true
            - name: WEB_URL
              value: {{ .Values.cors.webUrl | quote }}
            - name: ADMIN_URL
              value: {{ .Values.cors.adminUrl | quote }}
          # Spring Boot Actuator health groups. Liveness never checks the database (a PostgreSQL restart must
          # not restart the api); readiness goes DOWN during graceful shutdown.
          # The JVM needs a while to start on this server: liveness/readiness only begin once it answers.
          startupProbe:
            httpGet:
              path: /health/liveness
              port: {{ .Values.service.port }}
            periodSeconds: 5
            failureThreshold: 36 # 3 minutes
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: {{ .Values.service.port }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: {{ .Values.service.port }}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
