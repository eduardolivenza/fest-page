# Secret ghcr-credentials: ghcr.io pull secret used by web, admin and api. Sealed for the homelab cluster.
# Rotate with kubeseal (see homelab repo, homelab-secrets skill). Never commit plaintext.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-credentials
  namespace: fest-descans
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-credentials
      namespace: fest-descans
    type: kubernetes.io/dockerconfigjson
