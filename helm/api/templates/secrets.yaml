{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
  password: {{ required "secrets.dbPassword is required when secrets.create=true" .Values.secrets.dbPassword | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword | quote }}
{{- end }}
