{{- /*
PostgreSQL on the official image (replaced the Bitnami subchart).
- Superuser "postgres" (password: secret key postgres-password) only for admin tasks.
- The app user owns the database but is not a superuser; it is created by the init
  script below, which runs only when the data directory is empty (first start).
- The Service keeps the old name "<release>-postgresql" so DATABASE_URL did not change.
  The StatefulSet has a new name because selector and volumeClaimTemplates are immutable.
*/ -}}
{{- $pg := .Values.postgresql -}}
{{- $name := printf "%s-db" .Release.Name -}}
{{- $isReady := printf "pg_isready -h 127.0.0.1 -p 5432 -U %s -d %s" ($pg.auth.username | quote) ($pg.auth.database | quote) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  10-app-user.sh: |
    #!/bin/sh
    # Creates the app role and hands it the database (and so the public schema).
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -v app_user="$APP_DB_USER" -v app_password="$APP_DB_PASSWORD" -v db="$POSTGRES_DB" <<'SQL'
    CREATE ROLE :"app_user" LOGIN PASSWORD :'app_password';
    ALTER DATABASE :"db" OWNER TO :"app_user";
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $pg.terminationGracePeriodSeconds }}
      securityContext:
        # uid/gid of the "postgres" user in the official Debian image
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}@{{ $pg.image.digest }}"
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            {{- range $k, $v := $pg.config }}
            - -c
            - {{ printf "%s=%v" $k $v | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Host kernel 7.0.0-42 (Ubuntu, kernel.apparmor_restrict_unprivileged_unconfined=1)
            # runs containers under the stacked label "cri-containerd.apparmor.d//&unconfined",
            # and the runtime-default profile then denies signals between processes of the
            # same container (dmesg: apparmor="DENIED" operation="signal" signal=urg/usr1).
            # PostgreSQL wakes its processes with SIGURG/SIGUSR1, so it stalls (2026-10-29/30
            # outage, restarts on 2026-11-02). Unconfined only for this container until the
            # host is fixed (homelab); non-root, no capabilities and seccomp still apply.
            appArmorProfile:
              type: Unconfined
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.auth.existingSecret }}
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | quote }}
            - name: APP_DB_USER
              value: {{ $pg.auth.username | quote }}
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.auth.existingSecret }}
                  key: password
          ports:
            - name: postgresql
              containerPort: 5432
          # During first init the image runs a temporary socket-only server, so TCP
          # pg_isready only succeeds once the real server is up.
          startupProbe:
            exec:
              command: [sh, -c, {{ $isReady | quote }}]
            {{- toYaml $pg.startupProbe | nindent 12 }}
          livenessProbe:
            exec:
              command: [sh, -c, {{ $isReady | quote }}]
            {{- toYaml $pg.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: [sh, -c, {{ $isReady | quote }}]
            {{- toYaml $pg.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            # postgres 18+ images keep PGDATA in /var/lib/postgresql/<major>/docker
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
