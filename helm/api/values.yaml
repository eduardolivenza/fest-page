image:
  repository: ghcr.io/eduardolivenza/festpage/api
  tag: api-v0.0.3
  pullPolicy: IfNotPresent
replicas: 1
service:
  port: 3001
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
# CORS allowed origins
cors:
  webUrl: https://festdescans.com
  adminUrl: https://admin.festdescans.com
ingress:
  className: traefik
  host: api.festdescans.com
  tls:
    enabled: false
    secretName: fest-descans-api-tls
    clusterIssuer: letsencrypt-prod
# secrets.create=true  → Helm creates the K8s Secret (manual helm install)
# secrets.create=false → Secret must already exist   (ArgoCD deploy)
#
# This secret is also used by the postgresql sub-chart (existingSecret).
# Bitnami reads 'password' to initialize the DB user; the app reads the
# same key, so they can never drift.
#
# To create it manually (ArgoCD path):
#   kubectl create secret generic fest-descans-api \
#     --from-literal=JWT_SECRET=<value> \
#     --from-literal=password=<alphanumeric-db-password> \
#     --from-literal=postgres-password=<alphanumeric-admin-password> \
#     -n fest-descans
#
# For manual helm install (secrets.create=true), set:
#   secrets.jwtSecret, secrets.dbPassword, secrets.postgresPassword
secrets:
  create: false
  jwtSecret: ""
  dbPassword: ""
  postgresPassword: ""
postgresql:
  enabled: true
  image:
    tag: latest
    digest: sha256:f67b10b185d344b15e9999b57bdbedb13b9a4c33aa3a939467ee519cec49d40e
  auth:
    database: fest-descans
    username: fest-descans
    # Must match .Release.Name — ArgoCD sets this to "fest-descans-api" via the ApplicationSet.
    existingSecret: "fest-descans-api"
  primary:
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    startupProbe:
      enabled: true
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 180
    livenessProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 6
      successThreshold: 1
global:
  imagePullSecrets: []
