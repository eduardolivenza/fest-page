image:
  repository: ghcr.io/eduardolivenza/festpage/api
  tag: api-v0.0.3
  pullPolicy: IfNotPresent
replicas: 1
service:
  port: 3001
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
# CORS allowed origins
cors:
  webUrl: https://festdescans.com
  adminUrl: https://admin.festdescans.com
ingress:
  className: traefik
  host: api.festdescans.com
  tls:
    enabled: false
    secretName: fest-descans-api-tls
    clusterIssuer: letsencrypt-prod
# Secrets are SealedSecrets in templates/ (encrypted for the homelab cluster's
# sealed-secrets controller, safe to commit):
#   sealed-secret.yaml            -> Secret "fest-descans-api": JWT_SECRET, password, postgres-password
#                                   (also the postgresql subchart's existingSecret)
#   sealed-ghcr-credentials.yaml  -> Secret "ghcr-credentials" (ghcr.io pull secret for web/admin/api)
# Rotate: kubectl create secret ... --dry-run=client -o yaml | kubeseal -o yaml > templates/<file>.yaml
# DB passwords are only read at first init: also ALTER USER inside PostgreSQL when rotating.
# Full guide: homelab repo, .claude/skills/homelab-secrets/SKILL.md
postgresql:
  enabled: true
  image:
    tag: latest
    digest: sha256:f67b10b185d344b15e9999b57bdbedb13b9a4c33aa3a939467ee519cec49d40e
  auth:
    database: fest-descans
    username: fest-descans
    # Must match .Release.Name — ArgoCD sets this to "fest-descans-api" via the ApplicationSet.
    existingSecret: "fest-descans-api"
  primary:
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    startupProbe:
      enabled: true
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 180
    livenessProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 6
      successThreshold: 1
    terminationGracePeriodSeconds: 120
    extendedConfiguration: |
      recovery_init_sync_method = syncfs
      checkpoint_timeout = 60s
      io_method = sync
global:
  # Pull secret for the private ghcr.io images. The SealedSecret lives in the api chart
  # (helm/api/templates/sealed-ghcr-credentials.yaml); all apps share the namespace.
  imagePullSecrets:
    - name: ghcr-credentials
