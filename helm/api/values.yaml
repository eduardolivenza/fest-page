image:
  repository: ghcr.io/eduardolivenza/festpage/api
  tag: v0.0.17
  pullPolicy: IfNotPresent
replicas: 2
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
# CORS allowed origins
cors:
  webUrl: https://festpage.com
  adminUrl: https://admin.festpage.com
ingress:
  className: nginx
  host: api.festpage.com
  tls:
    enabled: true
    secretName: festpage-api-tls
    clusterIssuer: letsencrypt-prod
# secrets.create=true  → Helm creates the K8s Secret (manual helm install)
# secrets.create=false → Secret must already exist   (ArgoCD deploy)
#
# DATABASE_URL is NOT stored here — it is constructed at runtime from the
# Bitnami-managed secret (festpage-api-postgresql / key: password).
#
# To create it manually:
#   kubectl create secret generic festpage-api \
#     --from-literal=JWT_SECRET=<value> \
#     -n festpage
secrets:
  create: false
  jwtSecret: ""
postgresql:
  enabled: true
  image:
    tag: latest
  auth:
    database: festpage
    username: festpage
    password: ""
  primary:
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
global:
  imagePullSecrets: []
