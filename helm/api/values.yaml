image:
  repository: ghcr.io/eduardolivenza/festpage/api
  tag: v0.0.22
  pullPolicy: IfNotPresent
replicas: 1
service:
  port: 3001
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
# CORS allowed origins
cors:
  webUrl: https://festpage.com
  adminUrl: https://admin.festpage.com
ingress:
  className: nginx
  host: api.festpage.com
  tls:
    enabled: true
    secretName: festpage-api-tls
    clusterIssuer: letsencrypt-prod
# secrets.create=true  → Helm creates the K8s Secret (manual helm install)
# secrets.create=false → Secret must already exist   (ArgoCD deploy)
#
# This secret is also used by the postgresql sub-chart (existingSecret).
# Bitnami reads 'password' to initialize the DB user; the app reads the
# same key, so they can never drift.
#
# To create it manually:
#   kubectl create secret generic festpage-api \
#     --from-literal=JWT_SECRET=<value> \
#     --from-literal=password=<alphanumeric-db-password> \
#     --from-literal=postgres-password=<alphanumeric-admin-password> \
#     -n festpage
secrets:
  create: false
  jwtSecret: ""
postgresql:
  enabled: true
  image:
    tag: latest
  auth:
    database: festpage
    username: festpage
    existingSecret: "festpage-api"
  primary:
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
global:
  imagePullSecrets: []
