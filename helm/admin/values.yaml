image:
  repository: ghcr.io/eduardolivenza/festpage/admin
  tag: v0.1.0
  pullPolicy: IfNotPresent
replicas: 1
service:
  port: 3002
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
apiUrl: https://api.festpage.com
ingress:
  className: traefik
  host: admin.festpage.com
  tls:
    enabled: false
    secretName: festpage-admin-tls
    clusterIssuer: letsencrypt-prod
global:
  imagePullSecrets: []
