# Defaults for Boot's Flyway auto-configuration (application.yml or env vars can override).
# A database created by Prisma (production) has tables but no Flyway history: record a baseline at V3
# (the last Prisma migration) instead of running V1-V3. PrismaBaselineGuard checks the Prisma history first.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.baseline-description=Prisma migrations 20260524132142_test_1, 20260524133555_v2, 20260525081137_v3
