services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: festpage
      POSTGRES_USER: festpage
      POSTGRES_PASSWORD: festpage_dev
    ports:
      - '5432:5432'
    volumes:
      # postgres 18+ images keep PGDATA in /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U festpage']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Flyway migrates the schema when the api starts. Sample data: apps/api/dev/seed.sql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/festpage
      SPRING_DATASOURCE_USERNAME: festpage
      SPRING_DATASOURCE_PASSWORD: festpage_dev
      # At least 32 bytes (HS256).
      JWT_SECRET: dev-super-secret-jwt-key-0123456789abcdef
      WEB_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3002
      # Cloudflare's always-pass test secret
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        # Cloudflare's always-pass test site key
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    ports:
      - '3000:3000'
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3002:3002'
    depends_on:
      - api

volumes:
  postgres_data:
